name: "HASHY NFT"
sourceurl: https://github.com/atipicial/atipicial-go/
supportedstandards: ["AEP-11", "AEP-22", "AEP-24", "AEP-27", "AEP-30", "AEP-31"]
safemethods: ["balanceOf", "decimals", "symbol", "totalSupply", "tokensOf", "ownerOf", "tokens", "properties", "royaltyInfo", "verify"]
events:
  - name: Transfer
    parameters:
      - name: from
        type: Hash160
      - name: to
        type: Hash160
      - name: amount
        type: Integer
      - name: tokenId
        type: ByteArray
permissions:
  - hash: fffdc93764dbaddd97c48f252a53ea4643faa3fd
    methods: ["update", "destroy"]
  - methods: ["onAEP11Payment"]
